name: CI

on:
  pull_request:
  push:
    branches:
      - VoyageMind-v2

permissions:
  contents: read

jobs:
  backend:
    name: Backend regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ''
      SERPER_API_KEY: ''
      OTEL_SDK_DISABLED: 'true'
      CREWAI_STORAGE_DIR: voyage-mind-ci
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt
      - name: Run regression and API tests
        run: python -m unittest discover -s backend/tests -v
      - name: Run offline evaluation regression fixture
        run: python backend/evaluation/run_regressions.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD
      - name: Confirm public documentation policy
        run: test "$(git ls-tree -r --name-only HEAD | grep -E '\.md$' | wc -l | tr -d ' ')" = 1
