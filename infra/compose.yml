name: voyagemind
services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: voyagemind
      POSTGRES_USER: voyagemind
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U voyagemind -d voyagemind]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: ../backend
    command: [alembic, upgrade, head]
    environment: &backend-env
      ENVIRONMENT: staging
      DATABASE_URL: postgresql+psycopg://voyagemind:${DATABASE_PASSWORD}@postgres:5432/voyagemind
      SESSION_SECRET: ${SESSION_SECRET}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL}
      CORS_ORIGINS: '["http://localhost:8080"]'
      ALLOWED_HOSTS: '["localhost","api","frontend"]'
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  api:
    build: ../backend
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: [127.0.0.1:8000:8000]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
  worker:
    build: ../backend
    command: [python, -m, app.workers.run]
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
  frontend:
    build:
      context: ../frontend
      args: { VITE_API_BASE_URL: http://localhost:8000 }
    ports: [127.0.0.1:8080:8080]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]

volumes:
  postgres-data:
secrets:
  database_password:
    file: ./secrets/database_password
