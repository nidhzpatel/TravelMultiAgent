server {
    listen 8080;
    server_name _;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:" always;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
